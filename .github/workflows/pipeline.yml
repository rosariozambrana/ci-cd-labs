name: Pipeline CI - Build y Pruebas

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compilar aplicacion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos de ejecucion a mvnw
        working-directory: app
        run: chmod +x mvnw

      - name: Compilar con Maven
        working-directory: app
        run: ./mvnw -B clean compile

  test:
    name: Ejecutar pruebas unitarias
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos de ejecucion a mvnw
        working-directory: app
        run: chmod +x mvnw

      - name: Ejecutar pruebas unitarias (Quality Gate)
        working-directory: app
        run: ./mvnw -B test

      - name: Publicar reporte de resultados (Artefacto)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas-surefire
          path: app/target/surefire-reports/
